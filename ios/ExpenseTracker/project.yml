name: ExpenseTracker
  bundleIdPrefix: com.shianne.expensetracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExpenseTracker
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shianne.expensetracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ExpenseTracker/Resources/Info.plist
  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExpenseTrackerTests
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shianne.expensetracker.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: ""
schemes:
  ExpenseTracker:
    build:
      targets:
        ExpenseTracker: all
        ExpenseTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExpenseTrackerTests
